name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The Tauri shell embeds ui/dist at compile time, so the frontend must exist first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Installer branding and pointer
        run: node scripts/check-installer-branding.mjs --dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version strings agree
        run: node scripts/check-versions.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      # Job logs need authentication; annotations do not. Naming the failing test here is what
      # makes a red run diagnosable from the public API instead of a bare exit code.
      - name: Name failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "^test .* FAILED$" test-output.txt | sed 's|^|::error::|' || true
          grep -A 6 "^---- .* stdout ----$" test-output.txt | head -120 || true

      # The concurrency tests fail on timing, not on logic: they can pass a
      # hundred runs and fail the one after the change that reintroduced the
      # race. A single run per push says nothing about them, so repeat them.
      - name: Concurrency stress
        shell: bash
        run: bash scripts/stress-concurrency.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Design tokens and surface table
        run: npm run lint:tokens
      - name: Five surfaces smoke
        run: npm run test:e2e
      - name: Handoff checklist
        run: node scripts/handoff-status.mjs
        working-directory: .

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Endpoint tests
        run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Offline and dependency-free: reads README.md, docs/ and the issue forms only.
      - name: Docs links, anchors and issue forms
        run: node scripts/check-docs.mjs

  # Item 9: advisories, licences, committed secrets and a bill of materials. The lane's own
  # script is tested here too, so a policy file that stops matching the workflow is caught.
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check publishes its advisory results as a check run.
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: RustSec advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lane self-test
        run: node --test scripts/supply-chain.test.mjs

      - name: SBOM
        run: node scripts/make-sbom.mjs sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ACTIVE-WORK.md and tmp/ are local-only; the check lives in scripts/ so
      # the pre-commit hook runs exactly the same code.
      - name: No local-only paths are committed
        run: bash scripts/check-hygiene.sh

  # Item 1: the real window. tauri-driver drives the built app through open, a scripted turn, an
  # approval and the diff. msedgedriver has to match the Edge that ships on the runner.
  window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        working-directory: ui
        run: npm ci
      - name: Window drivers
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --locked
          $edgePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $edge = (Get-Item $edgePath).VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath (Join-Path $env:USERPROFILE '.cargo/bin') -Force
      - name: Window end-to-end
        run: npm --prefix ui run test:window
