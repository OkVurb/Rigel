name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The Tauri shell embeds ui/dist at compile time, so the frontend must exist first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The concurrency tests fail on timing, not on logic: they can pass a
      # hundred runs and fail the one after the change that reintroduced the
      # race. A single run per push says nothing about them, so repeat them.
      - name: Concurrency stress
        shell: bash
        run: bash scripts/stress-concurrency.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Handoff checklist
        run: node scripts/handoff-status.mjs
        working-directory: .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Offline and dependency-free: reads README.md, docs/ and the issue forms only.
      - name: Docs links, anchors and issue forms
        run: node scripts/check-docs.mjs
