# Item 9: gitleaks scans the whole history with its default rules, except for the fixtures that
# deliberately contain non-working keys to prove redaction and provider-shape checks.

[extend]
useDefault = true

[allowlist]
description = "Fake credentials that exist only to exercise redaction and provider validation."
paths = [
    '''crates/rigel-core/src/redaction\.rs''',
    '''crates/rigel-core/src/agent/providers\.rs''',
    '''crates/rigel-core/tests/.*''',
    '''crates/rigel-cli/tests/.*''',
    '''scripts/supply-chain\.test\.mjs''',
    '''ui/src/.*\.(test|spec)\.[tj]sx?''',
    # Unit-test fixture tokens: each is deliberately fake and asserted as rejected/read.
    '''crates/rigel-core/src/agent/secret_scan\.rs''',
    '''crates/rigel-core/src/agent/agentchat\.rs''',
    '''crates/rigel-core/src/memory\.rs''',
    # Test-only fixtures under the vendored obscura browser and the iOS reader.
    '''vendor/rigel-b/.*/tests/.*''',
    '''ios/.*Tests/.*''',
    '''ios/tools/capture-fixtures\.py''',
    # Public Turnstile site key (client-side by design), not a secret.
    '''web/site\.js''',
    # Generated third-party MCP catalog: findings are OCI tags, version strings and prose.
    '''data/mcp-catalog\.json''',
]
