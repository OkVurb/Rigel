[package]
name = "rigel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rigel-core = { path = "../crates/rigel-core" }
rigel-mcp = { path = "../crates/rigel-mcp" }

[[bin]]
name = "patch_parse"
path = "fuzz_targets/patch_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_json"
path = "fuzz_targets/mcp_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings"
path = "fuzz_targets/settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "skill_frontmatter"
path = "fuzz_targets/skill_frontmatter.rs"
test = false
doc = false
bench = false

[workspace]
